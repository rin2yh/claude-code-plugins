name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JSON がパースできるか
        run: |
          git ls-files -z '*.json' | xargs -0 node -e '
            const fs = require("fs");
            for (const f of process.argv.slice(1)) {
              try { JSON.parse(fs.readFileSync(f, "utf8")); }
              catch (e) { console.error(`invalid JSON: ${f}: ${e.message}`); process.exitCode = 1; }
            }'

      - name: シェルスクリプトの構文
        run: bash -n plugins/fav-rules/bin/install-fav-rules
