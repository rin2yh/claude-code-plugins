name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Codex 用マニフェストは .claude-plugin/ から生成している。
      # 片方だけ直してコミットされると、Claude Code と Codex で内容がずれる。
      - name: Codex 用マニフェストが最新か
        run: node scripts/sync-manifests.mjs --check

      - name: JSON がパースできるか
        run: |
          git ls-files -z '*.json' | xargs -0 node -e '
            const fs = require("fs");
            for (const f of process.argv.slice(1)) {
              try { JSON.parse(fs.readFileSync(f, "utf8")); }
              catch (e) { console.error(`invalid JSON: ${f}: ${e.message}`); process.exitCode = 1; }
            }'

      - name: シェルスクリプトの構文
        run: bash -n plugins/fav-rules/bin/install-fav-rules

      # SKILL.md から references/*.md へのリンクは、実行環境の分岐そのもの。
      # 切れていると片方の環境で手順が読めなくなる。
      - name: references/ のリンク切れ
        run: |
          status=0
          for skill in plugins/*/skills/*/SKILL.md; do
            dir=$(dirname "$skill")
            grep -o '`references/[a-z0-9./-]*\.md`' "$skill" | tr -d '`' | sort -u | while read -r ref; do
              [ -f "$dir/$ref" ] || { echo "missing: $dir/$ref (referenced by $skill)" >&2; exit 1; }
            done || status=1
          done
          exit $status
